[faraday_server]
port=5985
bind_address=localhost
debug=false
session_timeout=12
api_token_expiration=43200
;custom_plugins_folder=/path/to/custom/plugins

[logger]
use_rfc5424_formatter = false

;[database]
;Per-process SQLAlchemy connection pool (web server and each Celery worker).
;Idle connections kept open per process = pool_size. Max connections per process = pool_size + max_overflow.
;pool_size=5
;max_overflow=15
;pool_timeout=60
;pool_recycle=1800
