[faraday_server]
port=5985
bind_address=localhost
debug=false
session_timeout=12
api_token_expiration=43200
;custom_plugins_folder=/path/to/custom/plugins

[logger]
use_rfc5424_formatter = false

;[database]
;Per-process SQLAlchemy connection pool (web server and each Celery worker).
;Max connections per process = pool_size + max_overflow. Lower these on shared databases.
;pool_size=20
;max_overflow=20
;pool_timeout=60
;pool_recycle=1800
